<style>

<body>
<div class="toile"></div>
<header>
  <img src="logo.png" alt="Société des Hôtels Littéraires">
  <h1>Le marché de Noël de l'Avent</h1>
  <div id="intro"></div>
</header>
<div class="poutre"></div><div class="guirlande" aria-hidden="true"></div>
<main>
  <div class="deco" aria-hidden="true">🌲 🛷 🦌 ⭐ 🥨 🍪 🕯️ 🦌 🌲</div>
  <p id="statut"></p>
  <div id="hier" class="hier" hidden></div>
  <ol id="grille"></ol>
</main>
<div class="guirlande" aria-hidden="true"></div>
<div class="sol" aria-hidden="true">🎄 🎁 🎅 🎁 🎄 🍪 🎄 🎁 ⛄ 🎄</div>

<dialog id="boite"><div class="int">
  <h2 id="titre"></h2>
  <div id="media"></div>
  <p class="q" id="question"></p>
  <form id="formulaire">
    <label for="nom">Votre prénom et nom</label><input id="nom" required autocomplete="name">
    <label for="hotel">Votre hôtel</label><input id="hotel" required>
    <div id="champ"><label for="reponse">Votre réponse</label><input id="reponse" required autocomplete="off"></div>
    <div id="choix" role="radiogroup" aria-label="Votre réponse" hidden></div>
    <div class="btns"><button class="act" type="submit">Je participe</button></div>
  </form>
  <p id="msg" role="status"></p>
  <div class="btns"><button class="act sec" type="button" id="fermer">Fermer</button></div>
</div></dialog>

<audio id="musique" src="musique.mp3" loop preload="metadata"></audio>
<button id="son" class="son" type="button" hidden>🔊 Musique</button>
<script>
/* ===== À RÉGLER (voir le guide) ===== */
const CONFIG = {
  annee: 2026,
  mois: 11,                            // 11 = novembre (VERSION TEST). Mettre 12 pour décembre
  publicUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSow-sMB2Sz2ZOQEtDGJ_pdmyuYfGheuMeW0fB36eqivwsQtExzADnFGPvQZCVsi1pduyY3tXSF2fb1/pub?gid=57306551&single=true&output=csv",                       // adresse de l'onglet « Public » publié en CSV (voir le guide)
  formUrl: "https://docs.google.com/forms/d/e/1FAIpQLSftwbLqikEG6ZL-cujsNK95cbYJNpeuL_h_UoP2B7_xCfTvmg/formResponse",
  champs: { jour: "entry.1385622191", nom: "entry.1390101850", hotel: "entry.923689216", reponse: "entry.1308543570" }
};
/* ===================================== */
const nomMois = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"][CONFIG.mois - 1];
const JEUX = [
 {t:"libre", q:"Quel conte d'Andersen met en scène une enfant qui grelotte un soir de réveillon en vendant des allumettes ?"},
 {t:"libre", q:"Je résous les enquêtes les plus mystérieuses grâce à mon sens de l’observation et de la déduction. J’habite au 221B Baker Street, à Londres, et mon fidèle compagnon est le docteur Watson. Qui suis-je ?"},
 {t:"libre", q:"Sous quel pseudonyme est connue Aurore Dupin ?"},
 {t:"libre", q:"Dans quelle ville la famille de Kevin doit-elle se rendre en avion dans Maman, j’ai raté l’avion ?"},
 {t:"qcm", q:"Dans quel département la SHL pose ses valises avec son nouvel hôtel à Brive-la-Gaillarde ?", o:["La Corrèze","La Creuse","La Dordogne","La Vienne"]},
 {t:"libre", q:"Remettez en ordre cet anagramme pour former un mot : VIRLE"},
 {t:"ouvert", q:"À qui aimeriez-vous que le prochain hôtel littéraire soit dédié ? (Il n'y a pas de mauvaises réponses aujourd'hui 🤓)"},
 {t:"qcm", q:"Dans quel pays le manguier et le bananier sont les arbres décorés à Noël, à l'instar du sapin en France ?", o:["L'Inde","Les Seychelles","L'Afrique du Sud","La Thaïlande"]},
 {t:"libre", q:"Quel grand rendez-vous littéraire a lieu chaque année à Brive-la-Gaillarde en novembre ?"},
 {t:"libre", q:"Complètez cette phrase de Proust : \"Longtemps, je me suis couché de bonne...\""},
 {t:"qcm", q:"Quelle écrivaine est à l'origine de textes sur Noël publiés dans la presse entre 1909 et 1948 puis dans le recueil Cadeaux de Noël ?", o:["Marguerite Duras","Colette","Simone de Beauvoir","Nathalie Sarraute"]},
 {t:"qcm", q:"Quel animal décore le sapin ukrainien pour porter chance ?", o:["Une araignée","Une biche","Un castor","Un dauphin"]},
 {t:"qcm", q:"Quel roman débute par ces mots «Mr et Mrs Dursley, qui habitaient au 4, Privet Drive, avaient toujours affirmé avec la plus grande fierté qu'ils étaient parfaitement normaux, merci pour eux. » ?", o:["Les Misérables","Le Petit Prince","Harry Potter à l'école des sorciers","1984"]},
 {t:"qcm", q:"Quelle spécialité de Brive est connue pour sa couleur violette ?", o:["Le caramel","La brioche","Le fromage","La moutarde"]},
 {t:"qcm", q:"Dans quelle ville alsacienne la plus ancienne mention écrite d'un sapin de Noël, en 1521, a-t-elle été conservée ?", o:["Colmar","Sélestat","Riquewihr","Kaysersberg"]},
 {t:"libre", q:"Combien de livres sont posés dans cette chambre ? (les affiches et les cadres ne comptent pas)"},
 {t:"qcm", q:"Que cache-t-on la veille de Noël en Norvège ?", o:["Les couteaux","Les chocolats","Les balais","Les écharpes"]},
 {t:"libre", q:"Comment s'appellent les habitants de Brive-la-Gaillarde ?"},
 {t:"qcm", q:"Quel fast-food est particulièrement populaire pour le repas de Noël au Japon ?", o:["McDonald's","KFC","Subway","Burger King"]},
 {t:"qcm", q:"Dans Un chant de Noël de Charles Dickens, quel est le prénom du personnage principal, connu pour son avarice ?", o:["Edward","Ebenezer","Ernest","Elliot"]},
 {t:"ouvert", q:"Si l'établissement où vous travaillez était un film de Noël, comment s'appellerait-il ? Laissez parler votre imagination 💭"},
 {t:"libre", q:"En Provence, combien de desserts composent le grand dessert de Noël ?"},
 {t:"libre", q:"Dans Le Grinch, de quelle couleur est le personnage qui déteste Noël ?"},
 {t:"qcm", q:"Que s'offre-t-on traditionnellement le soir du 24 décembre en Islande ?", o:["Des chocolats","Des fleurs séchées","Des galets","Des livres"]}
];
/* Photos et vidéos : décommentez et adaptez les lignes pour les jours choisis */
const MEDIAS = {
  16: { type: "image", src: "medias/chambre.jpeg", legende: "Une chambre de nos hôtels littéraires (touchez la photo pour l'agrandir)" },
  // 5:  { type: "image",   src: "medias/hotel-brive-1.jpg", legende: "Notre nouvel hôtel à Brive-la-Gaillarde" },
  // 12: { type: "video",   src: "medias/hotel-brive.mp4",   legende: "Visite de l'hôtel" },
  // 18: { type: "youtube", id: "IDENTIFIANT_YOUTUBE",       legende: "Dans les coulisses de l'hôtel" }
};
/* Formats : "libre" et "ouvert" = texte à écrire ; "qcm" = choix parmi les options (o) ; "vf" = Vrai ou Faux */
function preparerSaisie(jeu){
  const opts = jeu.t === "vf" ? ["Vrai", "Faux"] : (jeu.o || []);
  const champ = document.getElementById("champ"), choix = document.getElementById("choix"), rep = document.getElementById("reponse");
  choix.innerHTML = "";
  if (!opts.length){ champ.hidden = false; rep.required = true; choix.hidden = true; return; }
  champ.hidden = true; rep.required = false; choix.hidden = false;
  opts.forEach((o, i) => { const l = document.createElement("label"), r = document.createElement("input"); r.type = "radio"; r.name = "choix"; r.value = o; r.required = i === 0; l.appendChild(r); l.appendChild(document.createTextNode(" " + o)); choix.appendChild(l); });
}
function reponseSaisie(){ const r = document.querySelector('input[name="choix"]:checked'); return r ? r.value : document.getElementById("reponse").value.trim(); }
function afficherMedia(j){
  const z = document.getElementById("media"); z.innerHTML = "";
  const m = MEDIAS[j]; if (!m) return; let el;
  if (m.type === "image"){ el = document.createElement("img"); el.src = m.src; el.alt = m.legende || ""; el.style.cursor = "zoom-in"; el.addEventListener("click", () => window.open(m.src, "_blank")); }
  else if (m.type === "video"){ el = document.createElement("video"); el.src = m.src; el.controls = true; el.addEventListener("play", () => { if (mus && !mus.paused) mus.pause(); }); el.preload = "metadata"; el.playsInline = true; }
  else if (m.type === "youtube"){ el = document.createElement("iframe"); el.src = "https://www.youtube-nocookie.com/embed/" + m.id; el.allowFullscreen = true; el.title = m.legende || "Vidéo"; }
  else return;
  z.appendChild(el);
  if (m.legende){ const c = document.createElement("p"); c.className = "leg"; c.textContent = m.legende; z.appendChild(c); }
}
const params = new URLSearchParams(location.search), test = params.has("test");
let maintenant = new Date(), simulee = false;
if (params.get("date")){ const s = new Date(params.get("date") + "T12:00:00"); if (!isNaN(s)){ maintenant = s; simulee = true; } }
const nbJours = JEUX.length;
function etat(j){
  if (test) return "aujourdhui";
  const d = new Date(CONFIG.annee, CONFIG.mois - 1, j), f = new Date(CONFIG.annee, CONFIG.mois - 1, j + 1);
  return maintenant < d ? "futur" : maintenant >= f ? "passe" : "aujourdhui";
}
const cle = j => "shl_avent_" + CONFIG.annee + "_" + CONFIG.mois + "_" + j;
function lire(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function ecrire(k,v){ try { localStorage.setItem(k,v); } catch(e){} }

const FORMES = ["","h","w","w","h","","g","w","w","h","w","","g","","w","w","","h","","w","g","w","h",""];
const DECOS = ["🥨","⭐","🎁","🔔","🦌","🕯️","🍪","🍬"];
const hasard = (function(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })(2026);  /* 2026 = graine : changez-la pour un autre ordre */
const ordre = Array.from({length: nbJours}, (_, i) => i + 1);
for (let i = ordre.length - 1; i > 0; i--){ const k = Math.floor(hasard() * (i + 1)); const x = ordre[i]; ordre[i] = ordre[k]; ordre[k] = x; }
const grille = document.getElementById("grille"), boite = document.getElementById("boite");
let jourCourant = 0, auj = 0;
for (let idx = 0; idx < nbJours; idx++){
  const j = ordre[idx], e = etat(j), li = document.createElement("li"), b = document.createElement("button");
  li.className = FORMES[idx];
  b.className = "case " + e; b.type = "button";
  b.innerHTML = j + (e === "aujourdhui" && !test ? "<small>À ouvrir</small>" : e === "passe" ? "<small>Déjà ouverte</small>" : "");
  if (e === "aujourdhui" && !test) auj = j;
  b.setAttribute("aria-label", "Case du " + j + " " + nomMois + (e === "futur" ? ", pas encore ouverte" : e === "passe" ? ", déjà ouverte" : ""));
  b.addEventListener("click", () => { if (e === "aujourdhui") ouvrir(j); else if (e === "passe") ouvrirPasse(j); });
  const dd = document.createElement("span"); dd.className = "dec"; dd.setAttribute("aria-hidden", "true"); dd.textContent = DECOS[idx % DECOS.length]; b.appendChild(dd);
  li.appendChild(b); grille.appendChild(li);
}
const st = document.getElementById("statut");
st.textContent = test ? "Mode test : toutes les cases sont ouvertes."
  : auj ? "Aujourd'hui, c'est la case n° " + auj + ". Bonne chance !"
  : maintenant < new Date(CONFIG.annee, CONFIG.mois - 1, 1) ? "Rendez-vous le 1er " + nomMois + " pour ouvrir la première case."
  : "Le calendrier est terminé. Merci à toutes et à tous d'avoir joué !";
if (simulee && !test) st.textContent += " (date simulée : " + maintenant.toLocaleDateString("fr-FR") + ")";

/* Réponses et gagnants de la veille : lus dans l'onglet « Public » du Sheet, alimenté après chaque tirage */
const PUBLIC = {};
function lireCsv(t){
  const rows = []; let r = [], c = "", q = false;
  for (let i = 0; i < t.length; i++){ const ch = t[i];
    if (q){ if (ch === '"'){ if (t[i + 1] === '"'){ c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ","){ r.push(c); c = ""; }
    else if (ch === "\n"){ r.push(c); rows.push(r); r = []; c = ""; }
    else if (ch !== "\r") c += ch; }
  if (c !== "" || r.length){ r.push(c); rows.push(r); }
  return rows;
}
function majHier(){
  const z = document.getElementById("hier"), d = PUBLIC[auj - 1];
  if (!auj || !d){ z.hidden = true; return; }
  z.textContent = "Hier, case n° " + (auj - 1) + " : « " + JEUX[auj - 2].q + " » Réponse : " + d.reponse + ".";
  z.hidden = false;
}
async function chargerPublic(){
  if (!CONFIG.publicUrl) return;
  try {
    const r = await fetch(CONFIG.publicUrl + (CONFIG.publicUrl.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now());
    lireCsv(await r.text()).forEach(l => { const j = Number(l[0]); if (j) PUBLIC[j] = { reponse: (l[1] || "").trim() }; });
    majHier();
  } catch(e){}
}
function ouvrirPasse(j){
  jourCourant = j;
  document.getElementById("titre").textContent = "Case n° " + j + " : déjà ouverte";
  document.getElementById("question").textContent = JEUX[j - 1].q;
  afficherMedia(j);
  f.hidden = true;
  const d = PUBLIC[j];
  msg.textContent = "Case déjà ouverte : les participations sont closes. " + (d ? "Réponse : " + d.reponse : "La réponse sera dévoilée après le tirage.");
  boite.showModal();
}
chargerPublic();
const f = document.getElementById("formulaire"), msg = document.getElementById("msg");
function ouvrir(j){
  jourCourant = j; msg.textContent = "";
  document.getElementById("titre").textContent = "Case du " + j + " " + nomMois;
  document.getElementById("question").textContent = JEUX[j - 1].q;
  afficherMedia(j);
  document.getElementById("reponse").value = ""; preparerSaisie(JEUX[j - 1]);
  document.getElementById("nom").value = lire("shl_avent_nom") || "";
  document.getElementById("hotel").value = lire("shl_avent_hotel") || "";
  const deja = !test && lire(cle(j));
  f.hidden = !!deja;
  if (deja) msg.textContent = "Vous avez déjà participé aujourd'hui. Réponse du tirage demain !";
  boite.showModal();
}
document.getElementById("fermer").onclick = () => boite.close();
boite.addEventListener("click", ev => { if (ev.target === boite) boite.close(); });
boite.addEventListener("close", () => { document.getElementById("media").innerHTML = ""; });
f.addEventListener("submit", async ev => {
  ev.preventDefault();
  if (!CONFIG.formUrl){ msg.textContent = "Mode démo : le formulaire n'est pas encore relié, rien n'a été envoyé."; return; }
  const d = new FormData(), c = CONFIG.champs;
  d.append(c.jour, jourCourant);
  d.append(c.nom, f.nom.value.trim()); d.append(c.hotel, f.hotel.value.trim()); d.append(c.reponse, reponseSaisie());
  try {
    await fetch(CONFIG.formUrl, { method: "POST", mode: "no-cors", body: d });
    ecrire(cle(jourCourant), "1"); ecrire("shl_avent_nom", f.nom.value.trim()); ecrire("shl_avent_hotel", f.hotel.value.trim());
    f.hidden = true; msg.textContent = "Merci ! Votre réponse est bien enregistrée. Tirage au sort demain matin.";
  } catch(e){ msg.textContent = "L'envoi n'a pas fonctionné. Vérifiez votre connexion et réessayez."; }
});
/* Texte d'accueil : annonce avant le 1er du mois, puis texte de bienvenue */
const debut = new Date(CONFIG.annee, CONFIG.mois - 1, 1), avant = !test && maintenant < debut;
const TEXTES = avant
  ? ["Les lumières scintillent, les guirlandes s’allument… notre marché de Noël de l’Avent ouvre bientôt ses portes ! ✨",
     "Du 1er au 24 " + nomMois + ", poussez chaque jour la porte d’un nouveau chalet, percez ses énigmes et répondez à ses questions. Chaque jour, le hasard désigne une personne chanceuse qui repart avec une surprise.",
     "Nous vous attendons avec impatience : rendez-vous dès le 1er " + nomMois + "."]
  : ["Bienvenue au marché de Noël de l’Avent. Du 1er au 24 " + nomMois + ", poussez chaque jour la porte d’un nouveau chalet, percez ses énigmes et répondez à ses questions. Chaque jour, le hasard désigne une personne chanceuse qui repart avec une surprise."];
TEXTES.forEach(t => { const q = document.createElement("p"); q.textContent = t; document.getElementById("intro").appendChild(q); });
if (avant) document.getElementById("statut").hidden = true;
/* Musique : les navigateurs interdisent le son automatique ; elle démarre au premier clic ou toucher sur la page */
const mus = document.getElementById("musique"), son = document.getElementById("son");
mus.volume = 0.35;
let coupe = lire("shl_avent_son") === "off";
function majSon(){ son.textContent = mus.paused ? "🔇 Activer la musique" : "🔊 Couper la musique"; }
function jouer(){ if (!coupe) mus.play().then(majSon).catch(() => {}); }
const GESTES = ["pointerup", "click", "keydown", "touchend"];   /* gestes que les navigateurs (ordinateur et téléphone) acceptent pour lancer un son */
function premier(ev){ if (coupe || son.contains(ev.target)) return; mus.play().then(() => { GESTES.forEach(g => removeEventListener(g, premier)); majSon(); }).catch(() => {}); }
son.hidden = false; majSon();   /* le bouton est toujours visible : s'il indique « indisponible », le fichier musique.mp3 est introuvable */
mus.addEventListener("error", () => { son.textContent = "🔇 Musique indisponible"; son.disabled = true; });
mus.addEventListener("play", majSon); mus.addEventListener("pause", majSon);
GESTES.forEach(g => addEventListener(g, premier));
son.addEventListener("click", () => { if (mus.paused){ coupe = false; ecrire("shl_avent_son", "on"); mus.play().catch(() => {}); } else { coupe = true; ecrire("shl_avent_son", "off"); mus.pause(); } });
jouer();
if (!matchMedia("(prefers-reduced-motion: reduce)").matches){
  for (let i = 0; i < 45; i++){
    const f = document.createElement("span"); f.className = "flocon"; f.setAttribute("aria-hidden", "true"); f.textContent = i % 4 ? "•" : "❄";
    f.style.cssText = "left:" + Math.random() * 100 + "vw;font-size:" + (8 + Math.random() * 14) + "px;animation-duration:" + (9 + Math.random() * 10) + "s," + (3 + Math.random() * 3) + "s;animation-delay:-" + Math.random() * 14 + "s,0s";
    document.body.appendChild(f);
  }
}
</script>
</body>
